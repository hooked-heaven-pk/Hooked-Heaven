<style>
  :root{
  /* "only light" (not just "light") is what makes Android Chrome's Auto Dark Theme
     and similar browser-side inversions leave the page alone. Plain "light" here
     was silently overriding the <meta color-scheme> tag above. */
  color-scheme:only light;
  --paper:#FAF8F2;
  --ink:#2D3323;
  --soft-ink:#6F6B57;
  --forest:#486354;
  --gold:#B2A064;
  --mist:#EFEADC;
  --hair:#DFD9C9;

  --walnut:#6D552F;

  --card:#FFFDF8;
  --ok:#3F6B4E;
  --bad:#A8452F;
  --warn:#8A6D2F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* an explicit background on <html> too — if the browser ever paints outside
     <body> (overscroll, safe areas) it must not fall back to a dark canvas */

  body{background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-weight:300;line-height:1.55}
  button,input,select,textarea{font-family:inherit}
  .serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400}
  /* login */
  .login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:40px 34px;max-width:380px;width:100%}
  .login-box h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:27px;margin-bottom:4px}
  .login-box h1 em{font-style:italic;color:var(--forest)}
  .login-box .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft-ink);margin-bottom:24px}
  .inapp{background:#F5EBD6;border-radius:10px;padding:13px 15px;font-size:12.5px;
    line-height:1.6;margin-bottom:20px;color:var(--walnut)}
  /* shell */
  .app{display:none;min-height:100vh;grid-template-columns:212px minmax(0,1fr);max-width:100%}
  .app.active{display:grid}

  .side{background:var(--card);border-right:1px solid var(--hair);padding:26px 16px;display:flex;flex-direction:column}

    .side{position:fixed;inset:0 auto 0 0;width:212px;z-index:50;transform:translateX(-100%);transition:.25s}

  .catopt input{width:auto;margin:0}

  /* ---------- reorder controls ---------- */
  .ord{display:flex;flex-direction:column;gap:3px}

  .sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .sortbar .lbl{font-size:11.5px;color:var(--soft-ink);margin-right:2px}
  /* ---------- size rows ---------- */
  .szrow{display:grid;grid-template-columns:1fr 92px 74px 34px;gap:8px;align-items:end;margin-bottom:10px}
  .szrow input{width:100%;border:none;border-bottom:1px solid var(--hair);background:none;

  .szhead{display:grid;grid-template-columns:1fr 92px 74px 34px;gap:8px;margin-bottom:6px;

  @media(max-width:520px){
    .szrow{grid-template-columns:1fr 80px 62px 32px;gap:6px}

    .row2{flex-direction:column;gap:0}

    .acts .btn{width:100%}

</style>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = "https://tztpscrdaryzgqzkxtgj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ZaUk5SrrJkRrcWnvCXClnQ_ErsmhGC8";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let PRODS=[], ORDERS=[], ZONES=[], SET={}, view="products", LOAD_ERR=[], PIMAGES={}, CATS=[], PAGES=[], PCATS={}, PSIZES={};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function imgUrl(p){ if(!p) return ""; return sb.storage.from("product-images").getPublicUrl(p).data.publicUrl; }
function money(n){ return (SET.currency||"PKR") + " " + Number(n).toLocaleString(); }
/* ============================================================
   HELPERS
   ============================================================ */
/* crypto.randomUUID is missing on older mobile WebViews */
function uid(){
  try{ if(window.crypto && typeof crypto.randomUUID==="function") return crypto.randomUUID(); }catch(e){}
  return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
}
/* next free slot, not list length — deleting a product used to cause a collision */
function nextSort(list){ return list.reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0)+1; }
function errText(e){
  if(!e) return "unknown error";
  return [e.code,e.name,e.status||e.statusCode,e.message||e.error,e.details,e.hint]
    .filter(Boolean).join(" · ").slice(0,240);
}
function showErr(el,msg,detail){
  el.innerHTML = esc(msg) + (detail ? `<span class="why">${esc(detail)}</span>` : "");
  el.style.display = "block";
}
function isInApp(){ return /Instagram|FBAN|FBAV|FB_IAB|Line\/|KAKAOTALK/i.test(navigator.userAgent||""); }
/* ---------- photo shrink: phone originals are 4–10MB and fail to upload ---------- */
function loadBitmap(file){
  return new Promise((resolve,reject)=>{
    const fallback=()=>{
      const img=new Image(), url=URL.createObjectURL(file);
      img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); };
      img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("could not read the photo")); };
      img.src=url;
    };
    if(typeof createImageBitmap==="function") createImageBitmap(file).then(resolve).catch(fallback);
    else fallback();
  });
}
async function shrinkImage(file, maxPx=1400, quality=0.82){
  if(!file || !/^image\//.test(file.type||"")) return file;
  if(file.size < 400*1024) return file;
  try{
    const src = await loadBitmap(file);
    const sw = src.width || src.naturalWidth, sh = src.height || src.naturalHeight;
    if(!sw || !sh) return file;
    const k = Math.min(1, maxPx/Math.max(sw,sh));
    const c = document.createElement("canvas");
    c.width = Math.round(sw*k); c.height = Math.round(sh*k);
    c.getContext("2d").drawImage(src,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",quality));
    return (blob && blob.size < file.size) ? blob : file;
  }catch(e){ console.warn("resize skipped:",e); return file; }
}
/* one upload path for products and the logo */
async function uploadImage(file, prefix){
  if(!file.size) throw new Error("This browser could not read the photo. Try picking it from Gallery.");
  const blob = await shrinkImage(file);
  const ext = (blob.type === "image/jpeg") ? "jpg"
            : (((file.name||"").split(".").pop() || "jpg").toLowerCase());
  const path = (prefix||"") + uid() + "." + ext;
  const up = await sb.storage.from("product-images")
    .upload(path, blob, { contentType: blob.type || "image/jpeg" });
  if(up.error) throw up.error;
  return up.data.path;
}
/* ---------- auth ---------- */
async function boot(){
  if(isInApp()){
    document.getElementById("lg-inapp").innerHTML =
      `<div class="inapp">You're in Instagram's built-in browser, which doesn't keep you signed in
       and can block photo uploads.<br><br>Tap <strong>&#8943;</strong> at the top right and choose
       <strong>Open in browser</strong>, then bookmark the page so it's one tap away next time.</div>`;
  }
  const { data } = await sb.auth.getSession();
  data.session ? showApp() : showLogin();
}
async function doLogin(){
  const email=document.getElementById("lg-email").value.trim();
  const pass=document.getElementById("lg-pass").value;
  const btn=document.getElementById("lg-btn"), err=document.getElementById("lg-err");
  err.style.display="none";
  if(!email||!pass){ err.textContent="Enter your email and password."; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled=false; btn.textContent="Sign in";
  if(error){ err.textContent="Incorrect email or password."; err.style.display="block"; return; }
  showApp();
}
async function doLogout(){ await sb.auth.signOut(); showLogin(); }
function showLogin(){ document.getElementById("login").style.display="flex"; document.getElementById("app").classList.remove("active"); }
function showApp(){ document.getElementById("login").style.display="none"; document.getElementById("app").classList.add("active"); loadAll(); }
sb.auth.onAuthStateChange(e=>{ if(e==="SIGNED_OUT") showLogin(); });
/* ---------- data ---------- */
async function loadAll(){ LOAD_ERR=[]; await Promise.all([ldProds(),ldOrders(),ldZones(),ldSet(),ldImages(),ldCats(),ldPages(),ldPCats(),ldSizes()]); go(view); }
/* product -> [sizes], each with its own price and stock */
async function ldSizes(){ const r=await sb.from("product_sizes").select("*").order("sort_order");
  if(r.error){ console.error(r.error); LOAD_ERR.push("sizes"); return; }
  PSIZES={}; (r.data||[]).forEach(s=>{ (PSIZES[s.product_id] ||= []).push(s); }); }
function sizesOf(productId){ return PSIZES[productId] || []; }
/* what the shop page will say about this product right now */
function stockSummary(p){
  const sizes = sizesOf(p.id);
  if(!sizes.length){
    const n = Number(p.stock);
    return n <= 0 ? { text:"Sold out", low:true } : { text:`${n} in stock`, low:n <= 2 };
  }
  const total = sizes.reduce((s,x)=>s+Number(x.stock),0);
  const available = sizes.filter(x=>Number(x.stock) > 0).length;
  if(!available) return { text:`${sizes.length} sizes · sold out`, low:true };
  return { text:`${sizes.length} sizes · ${total} in stock`, low:total <= 2 };
}
/* product -> [category ids]. A product can now sit in several categories. */
async function ldPCats(){ const r=await sb.from("product_categories").select("*");
  if(r.error){ console.error(r.error); LOAD_ERR.push("product categories"); return; }
  PCATS={}; (r.data||[]).forEach(row=>{ (PCATS[row.product_id] ||= []).push(row.category_id); }); }
function catsOf(productId){ return PCATS[productId] || []; }
function catNames(productId){
  return catsOf(productId).map(id => (CATS.find(c=>c.id===id)||{}).name).filter(Boolean);
}

/* products with sizes show the cheapest–dearest span instead of one figure */
function priceSpread(productId){
  const prices = sizesOf(productId).map(s=>Number(s.price));
  if(!prices.length) return "—";
  const lo = Math.min(...prices), hi = Math.max(...prices);
  return lo === hi ? money(lo) : money(lo) + " – " + money(hi);
}
/* Write only what changed: add the newly ticked categories, remove the unticked
   ones. Untouched rows are left alone so we never churn the whole table. */
async function syncProductCategories(productId, wantIds){
  const have = catsOf(productId);
  const toAdd = wantIds.filter(id => !have.includes(id));
  const toRemove = have.filter(id => !wantIds.includes(id));
  if(toAdd.length){
    const r = await sb.from("product_categories")
      .insert(toAdd.map(cid => ({ product_id:productId, category_id:cid })));
    if(r.error) return r.error;
  }
  for(const cid of toRemove){
    const r = await sb.from("product_categories").delete()
      .eq("product_id", productId).eq("category_id", cid);
    if(r.error) return r.error;
  }
  return null;
}
/* ---------- product types (filter chips on the storefront) ----------
   Free text, but if the owner types a value that already exists with different
   casing or spacing we reuse the existing spelling, so "Hair pins" and
   "Hair Pins" don't end up as two separate buttons on the site. */
function subtypeOptions(){
  const seen = new Map();
  PRODS.forEach(p=>{
    const t = (p.subtype||"").trim();
    if(t && !seen.has(t.toLowerCase())) seen.set(t.toLowerCase(), t);
  });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b));
}
function normaliseSubtype(raw){
  const t = (raw||"").trim();
  if(!t) return null;
  const match = subtypeOptions().find(x => x.toLowerCase() === t.toLowerCase());
  return match || t;
}
/* ---------- ordering ----------
   sort_order values in the wild can be duplicated or missing (older rows, or
   products added before this screen existed). Rather than trusting them, we
   always rewrite the whole list as 1..N, so the order shown here is exactly
   what customers get. Only rows whose number actually changed are sent. */
async function persistOrder(list){
  const updates = [];
  list.forEach((p,i)=>{
    const want = i + 1;
    if(Number(p.sort_order) !== want) updates.push({ id:p.id, sort_order:want });
  });
  if(!updates.length) return true;
  for(const u of updates){
    const r = await sb.from("products").update({ sort_order:u.sort_order }).eq("id",u.id);
    if(r.error){ console.error("[persistOrder]",r.error); alert("Could not save the new order. "+errText(r.error)); return false; }
  }
  return true;
}
async function moveProd(id, dir){
  const i = PRODS.findIndex(p=>p.id===id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= PRODS.length) return;
  const list = PRODS.slice();
  [list[i], list[j]] = [list[j], list[i]];
  PRODS = list;          // optimistic: redraw immediately so the phone feels responsive
  vProducts();
  const ok = await persistOrder(list);
  await ldProds();       // re-read either way, so a failure can't leave a wrong order on screen
  vProducts();
}
async function sortProds(mode){
  const labels = { "price-asc":"price, low to high", "price-desc":"price, high to low",
                   "name":"name A–Z", "newest":"newest first" };
  if(!confirm(`Arrange all products by ${labels[mode]}?\n\nThis replaces your current order.`)) return;
  const list = PRODS.slice();
  if(mode === "price-asc")  list.sort((a,b)=>Number(a.price)-Number(b.price));
  if(mode === "price-desc") list.sort((a,b)=>Number(b.price)-Number(a.price));
  if(mode === "name")       list.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  if(mode === "newest")     list.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  PRODS = list;
  vProducts();
  await persistOrder(list);
  await ldProds();
  vProducts();
}

async function svProd(id){
  const name=document.getElementById("f-name").value.trim();

  const stockN=parseInt(document.getElementById("f-stockn").value,10);

  if(!name||isNaN(price)||price<0){ showErr(err,"Please fill in a name and a valid price."); return; }
  btn.disabled=true; btn.textContent="Saving…";
  let stage="signing in";
  try{
    const { data:s } = await sb.auth.getSession();
    if(!s || !s.session) throw new Error("You've been signed out. Please sign in again.");
    const colorsRaw = document.getElementById("f-colors").value.trim();
    const videoRaw = document.getElementById("f-video").value.trim();
    const wantCats = [...document.querySelectorAll(".f-cat")].filter(b=>b.checked).map(b=>b.value);

    // Categories live in their own table, so they can only be linked once the
    // product row exists. Only the differences are written.
    if(savedId){
      stage = "saving the categories";
      const err2 = await syncProductCategories(savedId, wantCats);
      if(err2) throw err2;

/* ============================================================
   SIZES  (each with its own price and stock)
   ------------------------------------------------------------
   Edited as one list with a single Save, rather than a sheet per
   size — the owner updates several counts in one sitting after a
   making session, and one button is far less tapping on a phone.
   ============================================================ */
let SZ_DRAFT = [], SZ_PRODUCT = null;
function edSizes(productId){
  const p = PRODS.find(x=>x.id===productId); if(!p) return;
  SZ_PRODUCT = productId;
  SZ_DRAFT = sizesOf(productId).map(s => ({ id:s.id, label:s.label, price:s.price, stock:s.stock }));
  if(!SZ_DRAFT.length) SZ_DRAFT = [{ id:null, label:"", price:p.price, stock:0 }];
  drawSizes();
}
function drawSizes(){
  const p = PRODS.find(x=>x.id===SZ_PRODUCT);
  const rows = SZ_DRAFT.map((s,i)=>`
    <div class="szrow">
      <input value="${esc(s.label)}" placeholder="0-3 months"
        oninput="szEdit(${i},'label',this.value)">
      <input type="number" min="0" step="1" value="${s.price===""?"":Number(s.price)}"
        oninput="szEdit(${i},'price',this.value)">
      <input type="number" step="1" value="${s.stock===""?"":Number(s.stock)}"
        oninput="szEdit(${i},'stock',this.value)">
      <button class="del" onclick="szRemove(${i})" title="Remove">&times;</button>
    </div>`).join("");
  document.getElementById("sheet").innerHTML = `
    <h2>Sizes — ${esc(p.name)}</h2>
    <div class="hint" style="margin:0 0 14px">Write the full price you want to charge for each size —
      not the difference. Customers see the size they pick and its price straight away.
      Leave this list empty and the product goes back to one price for everyone.</div>
    <div class="szhead"><span>Size</span><span>Price</span><span>Stock</span><span></span></div>
    ${rows}
    <button class="btn ghost sm" style="margin:4px 0 16px" onclick="szAdd()">+ Add size</button>
    <div class="hint">A size shows as sold out once its stock reaches 0. Update the numbers whenever
      you make or sell a piece.</div>
    <div class="err" id="sz-err" style="display:none"></div>
    <div class="acts">
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn forest" id="sz-save" onclick="svSizes()">Save sizes</button>
    </div>`;
  openSheet();
}
/* the draft is kept in memory and written in one go, so a half-typed row never
   reaches the database and the customer never sees a size called "0-" */
function szEdit(i, field, value){ SZ_DRAFT[i][field] = value; }
function szAdd(){
  const p = PRODS.find(x=>x.id===SZ_PRODUCT);
  SZ_DRAFT.push({ id:null, label:"", price:p.price, stock:0 });
  drawSizes();
}
function szRemove(i){
  SZ_DRAFT.splice(i,1);
  drawSizes();
}
async function svSizes(){
  const err = document.getElementById("sz-err"), btn = document.getElementById("sz-save");
  err.style.display = "none";
  const rows = SZ_DRAFT
    .map(s => ({ id:s.id, label:String(s.label||"").trim(),
                 price:Number(s.price), stock:parseInt(s.stock,10) }))
    .filter(s => s.label || s.id);   // a blank never-saved row is just dropped
  for(const s of rows){
    if(!s.label){ showErr(err,"Every size needs a name, or remove the empty row."); return; }
    if(isNaN(s.price) || s.price < 0){ showErr(err,`Enter a price for "${s.label}".`); return; }
    if(isNaN(s.stock)){ showErr(err,`Enter a stock number for "${s.label}".`); return; }
  }
  const seen = new Set();
  for(const s of rows){
    const k = s.label.toLowerCase();
    if(seen.has(k)){ showErr(err,`"${s.label}" is listed twice.`); return; }
    seen.add(k);
  }
  btn.disabled = true; btn.textContent = "Saving…";
  try{
    const existing = sizesOf(SZ_PRODUCT);
    const keptIds = rows.filter(s=>s.id).map(s=>s.id);
    // removed first: a size the owner deleted shouldn't block a rename that reuses its name
    for(const old of existing){
      if(!keptIds.includes(old.id)){
        const r = await sb.from("product_sizes").delete().eq("id", old.id);
        if(r.error) throw r.error;
      }
    }
    for(let i=0;i<rows.length;i++){
      const s = rows[i];
      const payload = { label:s.label, price:s.price, stock:s.stock, sort_order:i+1 };
      const r = s.id
        ? await sb.from("product_sizes").update(payload).eq("id", s.id)
        : await sb.from("product_sizes").insert({ ...payload, product_id:SZ_PRODUCT });
      if(r.error) throw r.error;
    }
    closeSheet();
    await ldSizes();
    vProducts();
  }catch(e){
    console.error("[svSizes]",e);
    const msg = /duplicate/i.test(errText(e))
      ? "Two sizes have the same name." : "Could not save the sizes.";
    showErr(err,msg,errText(e));
    btn.disabled = false; btn.textContent = "Save sizes";
  }
}

function edPhotos(productId){

        ${i===0?'<div class="cover">Shown first</div>':""}

    return `<div class="slot empty">Empty</div>`;
  }).join("");
  document.getElementById("sheet").innerHTML = `
    <h2>Photos — ${esc(p.name)}</h2>
    <div class="pgrid">${slots}</div>
    <div class="pcount">${imgs.length} of 4 photos. The first photo is shown first in the product gallery —
      remove and re-add to reorder.</div>

    <div class="hint">Large photos are resized automatically.</div>

      <button class="btn ghost" onclick="closeSheet()">Done</button>

async function addPhoto(productId){
  const file = document.getElementById("ph-file").files[0];
  const err = document.getElementById("ph-err"), btn = document.getElementById("ph-add");
  err.style.display="none";
  if(!file){ showErr(err,"Choose a photo first."); return; }
  if((PIMAGES[productId]||[]).length >= 4){ showErr(err,"This product already has 4 photos."); return; }
  btn.disabled=true; btn.textContent="Uploading…";
  try{
    const path = await uploadImage(file);
    const nextOrder = (PIMAGES[productId]||[]).reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0)+1;
    const r = await sb.from("product_images").insert({ product_id:productId, path, sort_order:nextOrder });
    if(r.error) throw r.error;
    await ldImages();
    edPhotos(productId);
    vProducts();
  }catch(e){
    console.error("[addPhoto]",e);
    // the database also enforces the 4-photo cap — surface that plainly instead of the raw SQL error
    const msg = /at most 4 photos/i.test(errText(e)) ? "This product already has 4 photos." : "Could not upload the photo.";
    showErr(err,msg,errText(e));
    btn.disabled=false; btn.textContent="Add photo";
  }
}
async function delPhoto(productId,imageId){

/* ---------- product types ----------
   A type only exists because some product uses it, so there is no separate
   list to keep tidy — but the owner still needs a way to fix a typo across
   every product at once, or clear a type off them entirely. */
function typeUsage(){
  const map = new Map();   // lower-case key -> { label, ids[] }
  PRODS.forEach(p=>{
    const t = (p.subtype||"").trim();
    if(!t) return;
    const k = t.toLowerCase();
    if(!map.has(k)) map.set(k, { label:t, ids:[] });
    map.get(k).ids.push(p.id);
  });
  return [...map.values()].sort((a,b)=>a.label.localeCompare(b.label));
}
function typesSection(){
  const types = typeUsage();
  return `
    <div class="head" style="margin-top:30px"><h1 style="font-size:22px">Product types</h1></div>
    <div class="card" style="background:var(--mist);border:none;font-size:13px">
      Types are the filter buttons customers see inside a category (for example Hair Pins
      inside Hair Accessories). You set a type when you edit a product \u2014 this list just lets you
      rename one everywhere at once, or clear it off every product using it.
      A category needs at least two different types before the buttons appear on your site.
    </div>
    <div class="card">${types.length ? `<table><thead><tr><th>Type</th><th>Used by</th><th></th></tr></thead><tbody>
      ${types.map(t=>`<tr>
        <td class="c-title"><strong>${esc(t.label)}</strong></td>
        <td>${t.ids.length} product${t.ids.length===1?"":"s"}</td>

        </td></tr>`).join("")}

}
async function applyToType(label, value, verb){
  const ids = PRODS.filter(p => (p.subtype||"").trim().toLowerCase() === label.toLowerCase()).map(p=>p.id);
  if(!ids.length) return;
  for(const id of ids){
    const r = await sb.from("products").update({ subtype:value }).eq("id",id);
    if(r.error){ alert("Could not "+verb+" the type. "+errText(r.error)); await ldProds(); vCats(); return; }
  }
  await ldProds();
  vCats();
}

async function svCat(id){
  const name=document.getElementById("c-name").value.trim();
  const tag=document.getElementById("c-tag").value.trim();
  const err=document.getElementById("c-err"), btn=document.getElementById("c-save");
  err.style.display="none";
  if(!name){ showErr(err,"Please enter a category name."); return; }
  btn.disabled=true; btn.textContent="Saving…";
  try{
    const payload={ name, tagline: tag||null };
    let r;
    if(id){
      r = await sb.from("categories").update(payload).eq("id",id);
    }else{
      // slug is what the site URL uses; keep it unique without bothering the owner
      let base = slugify(name) || "category";
      let slug = base, n = 2;
      while(CATS.some(c=>c.slug===slug)){ slug = base+"-"+n; n++; }
      r = await sb.from("categories").insert({...payload, slug, sort_order:nextSort(CATS)});
    }
    if(r.error) throw r.error;
    closeSheet(); await ldCats(); vCats();
  }catch(e){
    console.error("[svCat]",e);
    showErr(err,"Could not save the category.",errText(e));
    btn.disabled=false; btn.textContent="Save";
  }
}
async function delCat(id){
  const inCat = PRODS.filter(p=>catsOf(p.id).includes(id));
  // a product only becomes uncategorised if this was its last category
  const orphaned = inCat.filter(p=>catsOf(p.id).length===1).length;
  const warn = inCat.length
    ? `Delete this category?\n\n${inCat.length} product${inCat.length===1?"":"s"} will stay on your site.`
      + (orphaned ? `\n\n${orphaned} of them ${orphaned===1?"has":"have"} no other category, so ${orphaned===1?"it":"they"} will only show under All Products.` : "")
    : "Delete this category?";
  if(!confirm(warn)) return;
  const r=await sb.from("categories").delete().eq("id",id);
  if(r.error){ alert("Could not delete. "+errText(r.error)); return; }
  await Promise.all([ldCats(), ldProds(), ldPCats()]);
  vCats();
}

/* ============================================================
   SALE
   ------------------------------------------------------------
   The discount itself is applied by place_order in the database.
   This screen only edits the settings it reads, so the site and
   the order total can never disagree.
   ============================================================ */
const SALE_KEYS = ["sale_active","sale_percent","sale_start","sale_end","sale_banner_text"];
/* dates are judged in Pakistan time, the same as the database does */
function karachiToday(){
  return new Intl.DateTimeFormat("en-CA", { timeZone:"Asia/Karachi",
    year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
}
/* what the customer is seeing right now — the four states the owner cares about */
function saleState(){
  const pct = Number(SET.sale_percent || 0);
  const from = (SET.sale_start || "").trim();
  const to = (SET.sale_end || "").trim();
  const today = karachiToday();
  if(String(SET.sale_active || "0") !== "1") return { on:false, label:"Off", why:"The switch below is off, so customers pay full price." };
  if(!(pct > 0 && pct <= 100)) return { on:false, label:"Off", why:"Set a discount between 1 and 100 to start a sale." };
  if(from && today < from) return { on:false, label:"Scheduled", why:`Starts on ${from}. Nothing changes on the site until then.` };
  if(to && today > to) return { on:false, label:"Finished", why:`Ended on ${to}. Customers are back to full price.` };
  return { on:true, label:"Running", why:`Customers are getting ${pct}% off everything right now.`
    + (to ? ` This stops by itself after ${to}.` : " There is no end date, so it runs until you switch it off.") };
}
function vSale(){
  const s = saleState();
  const pct = SET.sale_percent || "";
  document.getElementById("main").innerHTML = `
    <div class="head"><h1>Sale</h1></div>
    <div class="card" style="background:${s.on?"var(--sage-wash)":"var(--mist)"};border:none">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
        <span class="pill ${s.on?"p-yes":"p-no"}">${s.label}</span>
        <strong style="font-size:15px">${s.on?`${pct}% off everything`:"No sale running"}</strong>
      </div>
      <div style="font-size:13px;color:var(--soft-ink)">${esc(s.why)}</div>
    </div>
    <div class="card"><div class="grid1">
      <div class="check">
        <input type="checkbox" id="sl-active" ${String(SET.sale_active||"0")==="1"?"checked":""}>
        <label style="margin:0;text-transform:none;font-weight:400;font-size:14px;letter-spacing:0" for="sl-active">Run a sale</label>
      </div>
      <div class="fld"><label>Discount (%)</label>
        <input id="sl-percent" type="number" min="1" max="100" step="1" value="${esc(pct)}" placeholder="e.g. 15"></div>
      <div class="hint" style="margin-top:-6px">Taken off the products only — delivery is never discounted.</div>
      <div class="row2">
        <div class="fld"><label>Start date</label><input id="sl-start" type="date" value="${esc(SET.sale_start||"")}"></div>
        <div class="fld"><label>End date</label><input id="sl-end" type="date" value="${esc(SET.sale_end||"")}"></div>
      </div>
      <div class="hint" style="margin-top:-6px">Both days are included, Pakistan time. The sale starts and stops
        by itself — you don't need to come back and switch it off. Leave a date empty for no limit.</div>
      <div class="fld"><label>Banner wording (optional)</label>
        <input id="sl-text" value="${esc(SET.sale_banner_text||"")}" placeholder="15% off everything"></div>
      <div class="hint" style="margin-top:-6px">Shown across the top of your site. Leave empty and it writes itself
        from the discount above.</div>
      <div>
        <button class="btn forest" id="sl-save" onclick="svSale()">Save sale</button>
        <span id="sl-msg" style="display:none;font-size:13px;margin-left:10px"></span>
      </div>
      <div class="err" id="sl-err" style="display:none"></div>
    </div></div>
    <div class="card" style="background:var(--mist);border:none;font-size:13px">
      Orders already placed keep the price they were placed at. Switching the sale off later
      never changes what an old order says you were paid.
    </div>`;
}
async function svSale(){
  const active = document.getElementById("sl-active").checked;
  const pctRaw = document.getElementById("sl-percent").value.trim();
  const from = document.getElementById("sl-start").value;
  const to = document.getElementById("sl-end").value;
  const text = document.getElementById("sl-text").value.trim();
  const err = document.getElementById("sl-err"), btn = document.getElementById("sl-save");
  const msg = document.getElementById("sl-msg");
  err.style.display = "none"; msg.style.display = "none";
  const pct = Number(pctRaw);
  // only validate the numbers when the sale is actually being switched on,
  // so the owner can save a half-filled draft
  if(active){
    if(!pctRaw || isNaN(pct) || pct <= 0 || pct > 100){
      showErr(err,"Enter a discount between 1 and 100 to run a sale."); return;
    }
    if(from && to && to < from){
      showErr(err,"The end date is before the start date."); return;
    }
  }
  btn.disabled = true; btn.textContent = "Saving…";
  try{
    const values = {
      sale_active: active ? "1" : "0",
      sale_percent: pctRaw && !isNaN(pct) ? String(pct) : "0",
      sale_start: from || "",
      sale_end: to || "",
      sale_banner_text: text
    };
    for(const k of SALE_KEYS){
      const r = await sb.from("shop_settings").upsert({ key:k, value:values[k] });
      if(r.error) throw r.error;
    }
    await ldSet();
    vSale();
    const m = document.getElementById("sl-msg");
    m.textContent = "Saved"; m.style.color = "var(--ok)"; m.style.display = "inline";
    setTimeout(()=>{ if(m) m.style.display = "none"; }, 2000);
  }catch(e){
    console.error("[svSale]",e);
    showErr(err,"Could not save the sale.",errText(e));
    btn.disabled = false; btn.textContent = "Save sale";
  }
}

  const z = id?ZONES.find(x=>x.id===id):null;
  document.getElementById("sheet").innerHTML = `
    <h2>${z?"Edit delivery area":"Add delivery area"}</h2>
    <div class="fld"><label>Area name</label><input id="z-name" value="${z?esc(z.name):""}" placeholder="e.g. Lahore / Karachi"></div>
    <div class="fld"><label>Delivery fee (${esc(SET.currency||"PKR")})</label><input id="z-fee" type="number" min="0" step="1" value="${z?z.fee:""}"></div>
    <div class="fld"><label>Note (optional)</label><input id="z-note" value="${z&&z.note?esc(z.note):""}" placeholder="2–3 days"></div>
    <div class="check"><input type="checkbox" id="z-active" ${!z||z.is_active?"checked":""}><label style="margin:0;text-transform:none;font-weight:400;font-size:14px;letter-spacing:0" for="z-active">Show at checkout</label></div>
    <div class="err" id="z-err" style="display:none"></div>
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn forest" id="z-save" onclick="svZone('${z?z.id:""}')">Save</button></div>`;
  openSheet();
}
async function svZone(id){
  const name=document.getElementById("z-name").value.trim();
  const fee=parseFloat(document.getElementById("z-fee").value);
  const note=document.getElementById("z-note").value.trim();
  const active=document.getElementById("z-active").checked;
  const err=document.getElementById("z-err"), btn=document.getElementById("z-save");
  err.style.display="none";
  if(!name||isNaN(fee)||fee<0){ showErr(err,"Please enter an area name and a valid fee."); return; }
  btn.disabled=true; btn.textContent="Saving…";
  const payload={name, fee, note:note||null, is_active:active};
  const r = id ? await sb.from("shipping_zones").update(payload).eq("id",id)
               : await sb.from("shipping_zones").insert({...payload, sort_order:nextSort(ZONES)});
  if(r.error){
    String(r.error.message||"").includes("duplicate")
      ? showErr(err,"An area with that name already exists.")
      : showErr(err,"Could not save.",errText(r.error));
    btn.disabled=false; btn.textContent="Save"; return;
  }
  closeSheet(); await ldZones(); vZones();
}
async function delZone(id){
  if(!confirm("Delete this delivery area? Past orders keep the area name they were placed with.")) return;
  const r=await sb.from("shipping_zones").delete().eq("id",id);
  if(r.error){ alert("Could not delete. "+errText(r.error)); return; }
  await ldZones(); vZones();
}
/* ============================================================
   SETTINGS
   ============================================================ */
const SFIELDS=[
  ["shop_name","Shop name"],
  ["instagram_handle","Instagram handle"],
  ["currency","Currency code"],
  ["payment_method","Payment method"],
  ["payment_account_name","Payment account name"],
  ["payment_account_number","Payment account number"]
];
function vSettings(){
  document.getElementById("main").innerHTML = `
    <div class="head"><h1>Settings</h1></div>
    <div class="card">
      <h2 style="margin-bottom:6px">Logo</h2>
      <p style="color:var(--soft-ink);font-size:12.5px;margin-bottom:14px">Shown in the header and footer of your site.</p>
      ${SET.logo_path ? `<img class="prev" src="${imgUrl(SET.logo_path)}">` : ""}
      <div class="fld"><label>Upload logo</label><input type="file" id="s-logo" accept="image/*"></div>
      <button class="btn forest sm" id="logo-save" onclick="saveLogo()">Save logo</button>
      <div class="err" id="logo-msg" style="display:none"></div>
    </div>
    <div class="card"><div class="grid1">
      ${SFIELDS.map(([k,l])=>`<div class="fld"><label>${l}</label><input id="s-${k}" value="${esc(SET[k]||"")}"></div>`).join("")}
      <div><button class="btn forest" onclick="svSettings()">Save settings</button>
        <span id="s-msg" style="display:none;font-size:13px;margin-left:10px"></span></div>
    </div></div>
    <div class="card" style="background:var(--mist);border:none;font-size:13px">
      Delivery fees are managed in <strong>Delivery areas</strong>.
    </div>
    <div class="card">
      <h2 style="margin-bottom:6px">Change password</h2>
      <p style="color:var(--soft-ink);font-size:12.5px;margin-bottom:16px">
        Only you can see this dashboard. If you were given a starting password, change it here.
      </p>
      <div class="grid1">
        <div class="fld"><label>New password</label>
          <input type="password" id="pw-new" placeholder="At least 8 characters" autocomplete="new-password"></div>
        <div class="fld"><label>Repeat new password</label>
          <input type="password" id="pw-again" autocomplete="new-password"></div>
        <div>
          <button class="btn forest" id="pw-save" onclick="changePassword()">Update password</button>
          <span id="pw-msg" style="display:none;font-size:13px;margin-left:10px"></span>
        </div>
      </div>
    </div>`;
}
async function saveLogo(){
  const file=document.getElementById("s-logo").files[0];
  const msg=document.getElementById("logo-msg"), btn=document.getElementById("logo-save");
  msg.style.display="none";
  if(!file){ showErr(msg,"Choose a file first."); return; }
  btn.disabled=true; btn.textContent="Saving…";
  try{
    const path = await uploadImage(file,"logo-");
    const r=await sb.from("shop_settings").upsert({key:"logo_path", value:path});
    if(r.error) throw r.error;
    await ldSet();
    vSettings();
  }catch(e){
    console.error(e);
    showErr(msg,"Could not save the logo.",errText(e));
    btn.disabled=false; btn.textContent="Save logo";
  }
}
async function svSettings(){
  const msg=document.getElementById("s-msg");
  try{
    for(const [k] of SFIELDS){
      const value=document.getElementById(`s-${k}`).value.trim();
      const r=await sb.from("shop_settings").upsert({key:k, value});
      if(r.error) throw r.error;
    }
    await ldSet();
    msg.textContent="Saved"; msg.style.color="var(--ok)"; msg.style.display="inline";
    setTimeout(()=>msg.style.display="none",2000);
  }catch(e){
    console.error(e);
    msg.textContent="Could not save — "+errText(e); msg.style.color="var(--bad)"; msg.style.display="inline";
  }
}
async function changePassword(){
  const pw=document.getElementById("pw-new").value;
  const again=document.getElementById("pw-again").value;
  const msg=document.getElementById("pw-msg");
  const btn=document.getElementById("pw-save");
  const fail=(t)=>{ msg.textContent=t; msg.style.color="var(--bad)"; msg.style.display="inline"; };
  msg.style.display="none";
  if(!pw || !again) return fail("Please fill in both boxes.");
  if(pw.length < 8) return fail("Please use at least 8 characters.");
  if(pw !== again) return fail("The two passwords don't match.");
  btn.disabled=true; btn.textContent="Updating…";
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled=false; btn.textContent="Update password";
  if(error){ console.error(error); return fail("Could not update password. Please try again."); }
  document.getElementById("pw-new").value="";
  document.getElementById("pw-again").value="";
  msg.textContent="Password updated — use it next time you sign in.";
  msg.style.color="var(--ok)";
  msg.style.display="inline";
}
boot();
</script>
