<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<title>Hooked Heaven — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    color-scheme:light;
    --paper:#FBFAF7; --card:#FFFFFF; --ink:#35302A; --soft-ink:#7C7566;
    --forest:#2E5E4E; --gold:#B8912F; --mist:#EDE9E0; --hair:#E4DFD4;
    --ok:#3E7A5C; --warn:#B8912F; --bad:#A8452F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-weight:300;line-height:1.55}
  button,input,select,textarea{font-family:inherit}
  .serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400}

  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:40px 34px;max-width:380px;width:100%}
  .login-box h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:27px;margin-bottom:4px}
  .login-box h1 em{font-style:italic;color:var(--forest)}
  .login-box .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft-ink);margin-bottom:24px}

  /* shell */
  .app{display:none;min-height:100vh;grid-template-columns:212px 1fr;max-width:100%}
  .app.active{display:grid}
  .app > div{min-width:0}
  @media(max-width:820px){.app.active{grid-template-columns:1fr}}
  .side{background:var(--card);border-right:1px solid var(--hair);padding:26px 16px;display:flex;flex-direction:column}
  @media(max-width:820px){
    .side{position:fixed;inset:0 auto 0 0;width:212px;z-index:50;transform:translateX(-100%);transition:.25s}
    .side.open{transform:translateX(0)}
  }
  .backdrop{display:none;position:fixed;inset:0;background:rgba(53,48,42,.35);z-index:49}
  .backdrop.on{display:block}
  @media(min-width:821px){.backdrop{display:none!important}}
  .side .brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;padding:0 8px;margin-bottom:26px}
  .side .brand em{font-style:italic;color:var(--forest)}
  .side nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .side nav button{text-align:left;background:none;border:none;padding:10px 12px;border-radius:8px;font-size:13.5px;
    color:var(--ink);display:flex;gap:10px;align-items:center;letter-spacing:.01em}
  .side nav button:hover{background:var(--mist)}
  .side nav button.on{background:var(--mist);color:var(--forest);font-weight:500}
  .side .out{margin-top:auto;background:none;border:none;color:var(--soft-ink);font-size:12.5px;text-align:left;padding:10px 12px}
  .topbar{display:none;background:var(--card);border-bottom:1px solid var(--hair);padding:13px 18px;align-items:center;justify-content:space-between}
  @media(max-width:820px){.topbar{display:flex}}
  .topbar button{background:none;border:none;font-size:20px;color:var(--forest)}
  .topbar .t{font-family:"Cormorant Garamond",Georgia,serif;font-size:17px}

  main{padding:32px 36px;max-width:960px}
  @media(max-width:820px){main{padding:18px 14px;max-width:100%}}
  .head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
  .head h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:27px}
  @media(max-width:620px){.head h1{font-size:22px}.head .btn{width:100%}}

  .btn{border:none;border-radius:999px;padding:11px 22px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:500;cursor:pointer;transition:.2s}
  .forest{background:var(--forest);color:var(--paper)}
  .forest:hover{background:#244C3E}
  .ghost{background:var(--card);border:1px solid var(--hair);color:var(--ink)}
  .ghost:hover{border-color:var(--forest);color:var(--forest)}
  .danger{background:var(--card);border:1px solid #E9D2CB;color:var(--bad)}
  .danger:hover{background:#FBF0ED}
  .sm{padding:8px 15px;font-size:10.5px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .card{background:var(--card);border-radius:12px;border:1px solid var(--hair);padding:20px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft-ink);padding:0 12px 10px;border-bottom:1px solid var(--hair)}
  td{padding:12px;border-bottom:1px solid var(--hair);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--mist)}
  .pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:10.5px;font-weight:500;text-transform:capitalize;letter-spacing:.03em}
  .p-pending{background:#F5EBD6;color:var(--warn)}
  .p-confirmed{background:#DEE7E4;color:var(--forest)}
  .p-shipped{background:#E4E5EF;color:#5A5A8F}
  .p-completed{background:#DCEBE1;color:var(--ok)}
  .p-cancelled{background:#F3DFDA;color:var(--bad)}
  .p-yes{background:#DCEBE1;color:var(--ok)}
  .p-no{background:var(--mist);color:var(--soft-ink)}

  @media(max-width:640px){
    .card{padding:12px}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--hair);border-radius:12px;padding:13px 15px;margin-bottom:10px;
      display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
    tr:last-child{margin-bottom:0}
    td{border:none;padding:0;width:auto;flex:0 0 auto;font-size:13.5px}
    td:empty{display:none}
    .c-title{flex:1 1 auto;min-width:0}
    td:not(.c-title):not(.c-act):not(.c-thumb){font-size:12.5px;color:var(--soft-ink)}
    .c-act{flex:1 1 100%;display:flex;gap:8px;margin-top:4px}
    .c-act .btn{flex:1}
    .thumb{width:38px;height:38px}
  }

  .state{text-align:center;padding:46px 20px;color:var(--soft-ink);font-size:13px}

  .ov{position:fixed;inset:0;background:rgba(53,48,42,.35);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:36px 20px;overflow-y:auto}
  .ov.active{display:flex}
  .sheet{background:var(--paper);border:1px solid var(--hair);border-radius:14px;max-width:520px;width:100%;padding:26px}
  .sheet h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:23px;margin-bottom:16px}
  .fld{margin-bottom:15px}
  .fld label{display:block;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--soft-ink);margin-bottom:7px}
  .fld input,.fld textarea,.fld select{width:100%;border:none;border-bottom:1px solid var(--hair);background:none;
    padding:9px 2px;font-size:14.5px;color:var(--ink)}
  .fld textarea{resize:vertical;min-height:64px}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-bottom-color:var(--forest)}
  .row2{display:flex;gap:14px}
  .row2 .fld{flex:1}
  .check{display:flex;align-items:center;gap:9px;margin-bottom:15px;font-size:14px}
  .check input{width:auto}
  .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .err{color:var(--bad);font-size:12.5px;margin-top:10px}
  .prev{width:100%;max-width:150px;aspect-ratio:1/1;border-radius:12px;object-fit:cover;background:var(--mist);margin-bottom:10px}
  .odet table{width:100%;font-size:13px;margin:10px 0}
  .odet td{padding:4px 0;border:none}
  .rcpt{width:100%;max-height:320px;object-fit:contain;border:1px solid var(--hair);border-radius:10px;background:var(--mist)}
  .grid1{display:grid;gap:14px;max-width:460px}

  @media(max-width:640px){
    .fld input,.fld textarea,.fld select,.login-box input{font-size:16px}
    .ov{padding:0;align-items:flex-start}
    .sheet{border:none;border-radius:0;min-height:100vh;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}
    .row2{flex-direction:column;gap:0}
    .acts{flex-direction:column-reverse}
    .acts .btn{width:100%}
    .grid1{max-width:100%}
  }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <h1>Hooked <em>Heaven</em></h1>
    <div class="sub">studio admin</div>
    <div class="fld"><label>Email</label><input id="lg-email" type="email" placeholder="you@example.com"></div>
    <div class="fld"><label>Password</label><input id="lg-pass" type="password" placeholder="••••••••"></div>
    <button class="btn forest" style="width:100%" id="lg-btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="lg-err" style="display:none"></div>
  </div>
</div>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">Hooked <em>Heaven</em></div>
    <nav>
      <button data-v="products"  onclick="go('products')">Products</button>
      <button data-v="orders"    onclick="go('orders')">Orders</button>
      <button data-v="shipping"  onclick="go('shipping')">Delivery areas</button>
      <button data-v="settings"  onclick="go('settings')">Settings</button>
    </nav>
    <button class="out" onclick="doLogout()">Sign out</button>
  </aside>
  <div class="backdrop" id="backdrop" onclick="side(false)"></div>
  <div>
    <div class="topbar">
      <button onclick="side()">☰</button>
      <div class="t">Hooked Heaven</div>
      <span style="width:20px"></span>
    </div>
    <main id="main"></main>
  </div>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
/* ============================================================
   CONFIG — fill these in once the Supabase project exists
   ============================================================ */
const SUPABASE_URL = "https://tztpscrdaryzgqzkxtgj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ZaUk5SrrJkRrcWnvCXClnQ_ErsmhGC8";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let PRODS=[], ORDERS=[], ZONES=[], SET={}, view="products";

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function imgUrl(p){ if(!p) return ""; return sb.storage.from("product-images").getPublicUrl(p).data.publicUrl; }
function money(n){ return (SET.currency||"PKR") + " " + Number(n).toLocaleString(); }

/* ---------- auth ---------- */
async function boot(){
  const { data } = await sb.auth.getSession();
  data.session ? showApp() : showLogin();
}
async function doLogin(){
  const email=document.getElementById("lg-email").value.trim();
  const pass=document.getElementById("lg-pass").value;
  const btn=document.getElementById("lg-btn"), err=document.getElementById("lg-err");
  err.style.display="none";
  if(!email||!pass){ err.textContent="Enter your email and password."; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled=false; btn.textContent="Sign in";
  if(error){ err.textContent="Incorrect email or password."; err.style.display="block"; return; }
  showApp();
}
async function doLogout(){ await sb.auth.signOut(); showLogin(); }
function showLogin(){ document.getElementById("login").style.display="flex"; document.getElementById("app").classList.remove("active"); }
function showApp(){ document.getElementById("login").style.display="none"; document.getElementById("app").classList.add("active"); loadAll(); }
sb.auth.onAuthStateChange(e=>{ if(e==="SIGNED_OUT") showLogin(); });

/* ---------- data ---------- */
async function loadAll(){ await Promise.all([ldProds(),ldOrders(),ldZones(),ldSet()]); go(view); }
async function ldProds(){ const r=await sb.from("products").select("*").order("sort_order"); if(!r.error) PRODS=r.data; }
async function ldOrders(){ const r=await sb.from("orders").select("*, order_items(*)").order("created_at",{ascending:false}); if(!r.error) ORDERS=r.data; }
async function ldZones(){ const r=await sb.from("shipping_zones").select("*").order("sort_order"); if(!r.error) ZONES=r.data; }
async function ldSet(){ const r=await sb.from("shop_settings").select("*"); if(!r.error){ SET={}; r.data.forEach(s=>SET[s.key]=s.value); } }

/* ---------- shell ---------- */
function side(force){
  const s=document.getElementById("side"), b=document.getElementById("backdrop");
  const open = typeof force==="boolean" ? force : !s.classList.contains("open");
  s.classList.toggle("open",open); b.classList.toggle("on",open);
}
function go(v){
  view=v;
  document.querySelectorAll(".side nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  side(false);
  ({products:vProducts, orders:vOrders, shipping:vZones, settings:vSettings}[v])();
}
function openSheet(){ const o=document.getElementById("ov"); o.classList.add("active"); o.scrollTop=0; document.body.style.overflow="hidden"; }
function closeSheet(){ document.getElementById("ov").classList.remove("active"); document.body.style.overflow=""; }
document.getElementById("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeSheet(); });

/* ============================================================
   PRODUCTS
   ============================================================ */
function vProducts(){
  const rows = PRODS.map(p=>`<tr>
      <td class="c-thumb">${p.image_path?`<img class="thumb" src="${imgUrl(p.image_path)}">`:'<div class="thumb"></div>'}</td>
      <td class="c-title"><strong>${esc(p.name)}</strong></td>
      <td>${money(p.price)}</td>
      <td><span class="pill ${p.in_stock?"p-yes":"p-no"}">${p.in_stock?"Available":"Unavailable"}</span></td>
      <td class="c-act">
        <button class="btn ghost sm" onclick="edProd('${p.id}')">Edit</button>
        <button class="btn danger sm" onclick="delProd('${p.id}')">Delete</button>
      </td></tr>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="head"><h1>Products</h1><button class="btn forest" onclick="edProd()">+ Add product</button></div>
    <div class="card">${PRODS.length?`<table><thead><tr><th></th><th>Name</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="state">No products yet.</div>'}</div>`;
}
function edProd(id){
  const p = id?PRODS.find(x=>x.id===id):null;
  document.getElementById("sheet").innerHTML = `
    <h2>${p?"Edit product":"Add product"}</h2>
    ${p&&p.image_path?`<img class="prev" src="${imgUrl(p.image_path)}">`:""}
    <div class="fld"><label>Photo</label><input type="file" id="f-img" accept="image/*"></div>
    <div class="fld"><label>Name</label><input id="f-name" value="${p?esc(p.name):""}" placeholder="e.g. Sunflower Bag Charm"></div>
    <div class="fld"><label>Price (${esc(SET.currency||"PKR")})</label><input id="f-price" type="number" min="0" step="1" value="${p?p.price:""}"></div>
    <div class="fld"><label>Short description</label><input id="f-desc" value="${p?esc(p.description||""):""}" placeholder="e.g. Pair of sunflowers · cotton yarn"></div>
    <div class="check"><input type="checkbox" id="f-stock" ${!p||p.in_stock?"checked":""}><label style="margin:0;text-transform:none;font-weight:400;font-size:14px;letter-spacing:0" for="f-stock">Available to order</label></div>
    <div class="err" id="f-err" style="display:none"></div>
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn forest" id="f-save" onclick="svProd('${p?p.id:""}')">Save</button></div>`;
  openSheet();
}
async function svProd(id){
  const name=document.getElementById("f-name").value.trim();
  const price=parseFloat(document.getElementById("f-price").value);
  const desc=document.getElementById("f-desc").value.trim();
  const stock=document.getElementById("f-stock").checked;
  const file=document.getElementById("f-img").files[0];
  const err=document.getElementById("f-err"), btn=document.getElementById("f-save");

  err.style.display="none";
  if(!name||isNaN(price)||price<0){ err.textContent="Please fill in a name and a valid price."; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Saving…";
  try{
    const payload={name, price, description:desc||null, in_stock:stock};
    if(file){
      const ext=file.name.split(".").pop();
      const path=`${crypto.randomUUID()}.${ext}`;
      const up=await sb.storage.from("product-images").upload(path,file);
      if(up.error) throw up.error;
      payload.image_path=path;
    }
    const r = id ? await sb.from("products").update(payload).eq("id",id)
                 : await sb.from("products").insert({...payload, sort_order:PRODS.length+1});
    if(r.error) throw r.error;
    closeSheet(); await ldProds(); vProducts();
  }catch(e){
    console.error(e);
    err.textContent="Could not save. Please try again."; err.style.display="block";
    btn.disabled=false; btn.textContent="Save";
  }
}
async function delProd(id){
  if(!confirm("Delete this product? This can't be undone.")) return;
  const r=await sb.from("products").delete().eq("id",id);
  if(r.error){ alert("Could not delete."); return; }
  await ldProds(); vProducts();
}

/* ============================================================
   ORDERS
   ============================================================ */
const STATUSES=["pending","confirmed","shipped","completed","cancelled"];
function vOrders(){
  const rows = ORDERS.map(o=>`<tr>
      <td class="c-title"><strong>${esc(o.order_number)}</strong><br><span style="color:var(--soft-ink);font-size:12px">${new Date(o.created_at).toLocaleDateString()}</span></td>
      <td>${esc(o.customer_name)}<br><span style="color:var(--soft-ink);font-size:12px">${esc(o.customer_phone)}</span></td>
      <td>${money(o.total_amount)}</td>
      <td><span class="pill p-${o.status}">${o.status}</span></td>
      <td class="c-act"><button class="btn ghost sm" onclick="viewOrder('${o.id}')">View</button></td>
    </tr>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="head"><h1>Orders</h1></div>
    <div class="card">${ORDERS.length?`<table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="state">No orders yet.</div>'}</div>`;
}
async function viewOrder(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;

  let rcpt = '<p style="color:var(--soft-ink);font-size:13px">No receipt uploaded.</p>';
  if(o.receipt_path){
    const { data, error } = await sb.storage.from("payment-receipts").createSignedUrl(o.receipt_path, 3600);
    if(!error && data){
      rcpt = o.receipt_path.toLowerCase().endsWith(".pdf")
        ? `<a href="${data.signedUrl}" target="_blank" rel="noopener" class="btn ghost sm">Open receipt (PDF)</a>`
        : `<div><div style="font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--soft-ink);margin-bottom:7px">Payment receipt</div>
             <a href="${data.signedUrl}" target="_blank" rel="noopener"><img class="rcpt" src="${data.signedUrl}" alt="Receipt"></a></div>`;
    }else{
      rcpt = '<p style="color:var(--bad);font-size:13px">Receipt could not be loaded.</p>';
    }
  }

  const items = (o.order_items||[]).map(i=>
    `<tr><td>${esc(i.product_name)} × ${i.quantity}</td><td style="text-align:right">${money(i.line_total)}</td></tr>`).join("");

  document.getElementById("sheet").innerHTML = `
    <h2>${esc(o.order_number)}</h2>
    <div class="odet">
      <p><strong>${esc(o.customer_name)}</strong> · ${esc(o.customer_phone)}</p>
      <p style="color:var(--soft-ink);font-size:13px;margin-top:4px">${esc(o.customer_address)}${o.city?", "+esc(o.city):""}</p>
      <p style="color:var(--soft-ink);font-size:12.5px;margin-top:4px">Area: ${esc(o.shipping_zone_name||"—")}</p>
      <table>
        ${items}
        <tr><td style="padding-top:8px">Delivery</td><td style="text-align:right;padding-top:8px">${money(o.shipping_fee)}</td></tr>
        <tr><td><strong>Total</strong></td><td style="text-align:right"><strong>${money(o.total_amount)}</strong></td></tr>
      </table>
      <div style="margin:14px 0">${rcpt}</div>
      <div class="fld"><label>Status</label><select id="o-status">${STATUSES.map(s=>`<option value="${s}" ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
    </div>
    <div class="err" id="o-err" style="display:none"></div>
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">Close</button><button class="btn forest" onclick="svStatus('${o.id}')">Update status</button></div>`;
  openSheet();
}
async function svStatus(id){
  const status=document.getElementById("o-status").value;
  const r=await sb.from("orders").update({status}).eq("id",id);
  if(r.error){ const e=document.getElementById("o-err"); e.textContent="Could not update."; e.style.display="block"; return; }
  closeSheet(); await ldOrders(); vOrders();
}

/* ============================================================
   SHIPPING ZONES
   ============================================================ */
function vZones(){
  const rows = ZONES.map(z=>`<tr>
      <td class="c-title"><strong>${esc(z.name)}</strong>${z.note?`<br><span style="color:var(--soft-ink);font-size:12px">${esc(z.note)}</span>`:""}</td>
      <td>${money(z.fee)}</td>
      <td><span class="pill ${z.is_active?"p-yes":"p-no"}">${z.is_active?"Active":"Paused"}</span></td>
      <td class="c-act">
        <button class="btn ghost sm" onclick="edZone('${z.id}')">Edit</button>
        <button class="btn danger sm" onclick="delZone('${z.id}')">Delete</button>
      </td></tr>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="head"><h1>Delivery areas</h1><button class="btn forest" onclick="edZone()">+ Add area</button></div>
    <div class="card" style="background:var(--mist);border:none;font-size:13px">
      Customers pick one of these at checkout and its fee is added to their total. Pausing an area hides it without deleting it.
    </div>
    <div class="card">${ZONES.length?`<table><thead><tr><th>Area</th><th>Fee</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="state">No delivery areas yet.</div>'}</div>`;
}
function edZone(id){
  const z = id?ZONES.find(x=>x.id===id):null;
  document.getElementById("sheet").innerHTML = `
    <h2>${z?"Edit delivery area":"Add delivery area"}</h2>
    <div class="fld"><label>Area name</label><input id="z-name" value="${z?esc(z.name):""}" placeholder="e.g. Lahore / Karachi"></div>
    <div class="fld"><label>Delivery fee (${esc(SET.currency||"PKR")})</label><input id="z-fee" type="number" min="0" step="1" value="${z?z.fee:""}"></div>
    <div class="fld"><label>Note (optional)</label><input id="z-note" value="${z&&z.note?esc(z.note):""}" placeholder="2–3 days"></div>
    <div class="check"><input type="checkbox" id="z-active" ${!z||z.is_active?"checked":""}><label style="margin:0;text-transform:none;font-weight:400;font-size:14px;letter-spacing:0" for="z-active">Show at checkout</label></div>
    <div class="err" id="z-err" style="display:none"></div>
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn forest" id="z-save" onclick="svZone('${z?z.id:""}')">Save</button></div>`;
  openSheet();
}
async function svZone(id){
  const name=document.getElementById("z-name").value.trim();
  const fee=parseFloat(document.getElementById("z-fee").value);
  const note=document.getElementById("z-note").value.trim();
  const active=document.getElementById("z-active").checked;
  const err=document.getElementById("z-err"), btn=document.getElementById("z-save");

  err.style.display="none";
  if(!name||isNaN(fee)||fee<0){ err.textContent="Please enter an area name and a valid fee."; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Saving…";
  const payload={name, fee, note:note||null, is_active:active};
  const r = id ? await sb.from("shipping_zones").update(payload).eq("id",id)
               : await sb.from("shipping_zones").insert({...payload, sort_order:ZONES.length+1});
  if(r.error){
    err.textContent = String(r.error.message||"").includes("duplicate") ? "An area with that name already exists." : "Could not save.";
    err.style.display="block"; btn.disabled=false; btn.textContent="Save"; return;
  }
  closeSheet(); await ldZones(); vZones();
}
async function delZone(id){
  if(!confirm("Delete this delivery area? Past orders keep the area name they were placed with.")) return;
  const r=await sb.from("shipping_zones").delete().eq("id",id);
  if(r.error){ alert("Could not delete."); return; }
  await ldZones(); vZones();
}

/* ============================================================
   SETTINGS
   ============================================================ */
const SFIELDS=[
  ["shop_name","Shop name"],
  ["instagram_handle","Instagram handle"],
  ["currency","Currency code"],
  ["payment_method","Payment method"],
  ["payment_account_name","Payment account name"],
  ["payment_account_number","Payment account number"]
];
function vSettings(){
  document.getElementById("main").innerHTML = `
    <div class="head"><h1>Settings</h1></div>
    <div class="card">
      <h2 style="margin-bottom:6px">Logo</h2>
      <p style="color:var(--soft-ink);font-size:12.5px;margin-bottom:14px">Shown in the header and footer of your site.</p>
      ${SET.logo_path ? `<img class="prev" src="${imgUrl(SET.logo_path)}">` : ""}
      <div class="fld"><label>Upload logo</label><input type="file" id="s-logo" accept="image/*"></div>
      <button class="btn forest sm" onclick="saveLogo()">Save logo</button>
      <span id="logo-msg" style="display:none;font-size:13px;margin-left:10px"></span>
    </div>
    <div class="card"><div class="grid1">
      ${SFIELDS.map(([k,l])=>`<div class="fld"><label>${l}</label><input id="s-${k}" value="${esc(SET[k]||"")}"></div>`).join("")}
      <div><button class="btn forest" onclick="svSettings()">Save settings</button>
        <span id="s-msg" style="display:none;font-size:13px;margin-left:10px"></span></div>
    </div></div>
    <div class="card" style="background:var(--mist);border:none;font-size:13px">
      Delivery fees are managed in <strong>Delivery areas</strong>.
    </div>

    <div class="card">
      <h2 style="margin-bottom:6px">Change password</h2>
      <p style="color:var(--soft-ink);font-size:12.5px;margin-bottom:16px">
        Only you can see this dashboard. If you were given a starting password, change it here.
      </p>
      <div class="grid1">
        <div class="fld"><label>New password</label>
          <input type="password" id="pw-new" placeholder="At least 8 characters" autocomplete="new-password"></div>
        <div class="fld"><label>Repeat new password</label>
          <input type="password" id="pw-again" autocomplete="new-password"></div>
        <div>
          <button class="btn forest" id="pw-save" onclick="changePassword()">Update password</button>
          <span id="pw-msg" style="display:none;font-size:13px;margin-left:10px"></span>
        </div>
      </div>
    </div>`;
}
async function saveLogo(){
  const file=document.getElementById("s-logo").files[0];
  const msg=document.getElementById("logo-msg");
  msg.style.display="none";
  if(!file){ msg.textContent="Choose a file first"; msg.style.color="var(--bad)"; msg.style.display="inline"; return; }
  try{
    const ext=file.name.split(".").pop();
    const path=`logo-${crypto.randomUUID()}.${ext}`;
    const up=await sb.storage.from("product-images").upload(path,file);
    if(up.error) throw up.error;
    const r=await sb.from("shop_settings").upsert({key:"logo_path", value:path});
    if(r.error) throw r.error;
    await ldSet();
    vSettings();
  }catch(e){
    console.error(e);
    msg.textContent="Could not save logo"; msg.style.color="var(--bad)"; msg.style.display="inline";
  }
}

async function svSettings(){
  const msg=document.getElementById("s-msg");
  try{
    for(const [k] of SFIELDS){
      const value=document.getElementById(`s-${k}`).value.trim();
      const r=await sb.from("shop_settings").upsert({key:k, value});
      if(r.error) throw r.error;
    }
    await ldSet();
    msg.textContent="Saved"; msg.style.color="var(--ok)"; msg.style.display="inline";
    setTimeout(()=>msg.style.display="none",2000);
  }catch(e){
    console.error(e);
    msg.textContent="Could not save"; msg.style.color="var(--bad)"; msg.style.display="inline";
  }
}

async function changePassword(){
  const pw=document.getElementById("pw-new").value;
  const again=document.getElementById("pw-again").value;
  const msg=document.getElementById("pw-msg");
  const btn=document.getElementById("pw-save");
  const fail=(t)=>{ msg.textContent=t; msg.style.color="var(--bad)"; msg.style.display="inline"; };

  msg.style.display="none";
  if(!pw || !again) return fail("Please fill in both boxes.");
  if(pw.length < 8) return fail("Please use at least 8 characters.");
  if(pw !== again) return fail("The two passwords don't match.");

  btn.disabled=true; btn.textContent="Updating…";
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled=false; btn.textContent="Update password";

  if(error){ console.error(error); return fail("Could not update password. Please try again."); }

  document.getElementById("pw-new").value="";
  document.getElementById("pw-again").value="";
  msg.textContent="Password updated — use it next time you sign in.";
  msg.style.color="var(--ok)";
  msg.style.display="inline";
}

boot();
</script>
</body>
</html>
